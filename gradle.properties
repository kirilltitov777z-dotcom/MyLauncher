# Зависимости (Material3 1.5.0-beta02) требуют compileSdk 37, но пакета platforms;android-37
# в SDK-менеджере нет (только 37.0/37.1/37.2). Собираемся на стабильной 36.
android.experimental.disableCompileSdkChecks=true